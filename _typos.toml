[files]
# Vendored emoji data (short codes look like typos) and the AI scratch dir.
extend-exclude = ["public/pages/emoji.tsv", ".momomo"]

[default.extend-words]
# Deliberately malformed-URL fixtures in *.test.ts (a leading "H" is added on
# purpose to exercise prefix handling).
Hhttp = "Hhttp"
Hhttps = "Hhttps"
# trie.test.ts builds keys from the literal token "abd".
abd = "abd"
# cursorPrompt.test.ts uses the partial input "say @fo".
fo = "fo"
# feedkeys test expectation "BA", and the hex unit "U+00BA" in keyboardUtils.
BA = "BA"
