name: release

on:
  push:
    tags:
      - "v*"

# In-house distribution: builds are attached to the GitHub Release as assets,
# and the Firefox self-hosted update manifest is served from GitHub Pages,
# pointing back at those release assets.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm ci
      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build Chrome zip
        env:
          EXT_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm zip
      - name: Build Firefox zip
        env:
          EXT_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm zip:firefox
      # Firefox self-distribution requires an AMO-signed .xpi. This step is a
      # no-op until AMO_JWT_ISSUER / AMO_JWT_SECRET are set as repository
      # secrets; once they are, the signed .xpi is produced and published, and
      # the Pages updates.json below starts serving a working update.
      - name: Sign Firefox add-on (AMO unlisted)
        id: sign
        if: ${{ env.WEB_EXT_API_KEY != '' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          EXT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm dlx web-ext@8 sign \
            --channel=unlisted \
            --source-dir=apps/extension/dist/firefox-mv3 \
            --artifacts-dir=apps/extension/dist/signed
          xpi="$(find apps/extension/dist/signed -name '*.xpi' | head -1)"
          cp "$xpi" "apps/extension/dist/surfingkeys-${EXT_VERSION}-firefox.xpi"
      - name: Collect release assets
        run: |
          mkdir -p assets
          cp apps/extension/dist/surfingkeys-*-chrome.zip assets/
          cp apps/extension/dist/surfingkeys-*-firefox.zip assets/
          cp apps/extension/dist/surfingkeys-*-firefox.xpi assets/ 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: assets/

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            assets/*

  pages:
    runs-on: ubuntu-latest
    needs:
      - build
      - release
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The Firefox client fetches this manifest from gecko.update_url; its
      # entries point at the .xpi in the just-published GitHub Release. Only the
      # latest version is listed, which is all Firefox needs to offer the update.
      - name: Generate update manifest and landing page
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p site
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          cat > site/updates.json <<EOF
          {
            "addons": {
              "surfingkeys@omochice.github.io": {
                "updates": [
                  {
                    "version": "${VERSION}",
                    "update_link": "${base}/surfingkeys-${VERSION}-firefox.xpi"
                  }
                ]
              }
            }
          }
          EOF
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Surfingkeys — in-house distribution</title>
          </head>
          <body>
          <h1>Surfingkeys ${VERSION}</h1>
          <ul>
          <li><a href="${base}/surfingkeys-${VERSION}-firefox.xpi">Firefox (.xpi, self-updating)</a></li>
          <li><a href="${base}/surfingkeys-${VERSION}-chrome.zip">Chrome (.zip, load unpacked in developer mode)</a></li>
          </ul>
          <p>See the <a href="https://github.com/${GITHUB_REPOSITORY}/releases">releases</a> for older versions.</p>
          </body>
          </html>
          EOF
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
