coverage:
  paths:
    - coverage/lcov.info

codeToTestRatio:
  code:
    - "packages/*/src/**/*.ts"
    - "packages/*/src/**/*.tsx"
    - "apps/*/src/**/*.ts"
    - "apps/*/src/**/*.tsx"
    - "!**/*.test.ts"
    - "!**/*.test.tsx"
    - "!**/*.d.ts"
    - "!packages/test-support/**"
  test:
    - "packages/*/src/**/*.test.ts"
    - "packages/*/src/**/*.test.tsx"
    - "apps/*/src/**/*.test.ts"
    - "apps/*/src/**/*.test.tsx"

diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}

report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}

comment:
  if: is_pull_request
