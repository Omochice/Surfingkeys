services:
  otel-collector:
    # The contrib distribution is required:
    # because the file exporter is not part of the core collector image.
    image: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: otel-collector
        target: /etc/otelcol/config.yaml
    volumes:
      - ./.otel:/out
    ports:
      - "4318:4318"
    depends_on:
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:0.33.0@sha256:475319e883b66594d1a2f22ef168c2459802bb94548e6f25d9782bd5f5c19a3a
    ports:
      - "3000:3000"

  mcp-grafana:
    image: grafana/mcp-grafana:1.4.1@sha256:cfcf06863c23b2db64c41b0379d1efe95703aca4ba5434d90674f72ec0b7d810
    # Without --allowed-hosts the Host check only admits the bind address.
    command:
      [
        "-t",
        "streamable-http",
        "--address",
        "0.0.0.0:8000",
        "--allowed-hosts",
        "localhost:8000,127.0.0.1:8000",
        "--disable-write",
      ]
    environment:
      GRAFANA_URL: http://lgtm:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - lgtm

configs:
  otel-collector:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318

      exporters:
        otlphttp/lgtm:
          endpoint: http://lgtm:4318
        file:
          path: /out/otel.jsonl
          format: json

      service:
        pipelines:
          logs:
            receivers: [otlp]
            exporters: [otlphttp/lgtm, file]
