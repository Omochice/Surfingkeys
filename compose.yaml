services:
  otel-collector:
    # The file exporter is not part of the core collector image, hence the contrib distribution.
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: otel-collector
        target: /etc/otelcol/config.yaml
    volumes:
      - ./.otel:/out
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:0.34.0@sha256:b966ea107831d526d9eb8fe4d2d86c9e5731392fad9dce8296bcf2072031f07c
    ports:
      - "127.0.0.1:3000:3000"

  mcp-grafana:
    image: grafana/mcp-grafana:1.5.1@sha256:07c6614a8f8b6477e572444874c8c07baf145473977f014497cb59262af1944c
    # Without --allowed-hosts the Host check only admits the bind address.
    command:
      [
        "-t",
        "streamable-http",
        "--address",
        "0.0.0.0:8000",
        "--allowed-hosts",
        "localhost:8000,127.0.0.1:8000",
        "--disable-write",
      ]
    environment:
      GRAFANA_URL: http://lgtm:3000
      GRAFANA_ORG_ID: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - lgtm

configs:
  otel-collector:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318

      exporters:
        otlphttp/lgtm:
          endpoint: http://lgtm:4318
        file:
          path: /out/otel.jsonl
          format: json

      service:
        pipelines:
          logs:
            receivers: [otlp]
            exporters: [otlphttp/lgtm, file]
