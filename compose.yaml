services:
  otel-collector:
    # The file exporter is not part of the core collector image, hence the contrib distribution.
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: otel-collector
        target: /etc/otelcol/config.yaml
    volumes:
      - ./.otel:/out
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:0.39.0@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    ports:
      - "127.0.0.1:3000:3000"

  mcp-grafana:
    image: grafana/mcp-grafana:2.1.1@sha256:71a3f4e6f412d253611314233df709ec2571fb50e39742d23fa2940f670646dc
    # Without --allowed-hosts the Host check only admits the bind address.
    command:
      [
        "-t",
        "streamable-http",
        "--address",
        "0.0.0.0:8000",
        "--allowed-hosts",
        "localhost:8000,127.0.0.1:8000",
        "--disable-write",
      ]
    environment:
      GRAFANA_URL: http://lgtm:3000
      GRAFANA_ORG_ID: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - lgtm

configs:
  otel-collector:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318

      exporters:
        otlphttp/lgtm:
          endpoint: http://lgtm:4318
        file:
          path: /out/otel.jsonl
          format: json

      service:
        pipelines:
          logs:
            receivers: [otlp]
            exporters: [otlphttp/lgtm, file]
