services:
  otel-collector:
    # The file exporter is not part of the core collector image, hence the contrib distribution.
    image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: otel-collector
        target: /etc/otelcol/config.yaml
    volumes:
      - ./.otel:/out
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:0.41.1@sha256:1b852b77d7bcadb7699bfe7c78a51d059dff85168de674728cf7abf4474645e5
    ports:
      - "127.0.0.1:3000:3000"

  mcp-grafana:
    image: grafana/mcp-grafana:2.4.0@sha256:63d4501d3166c2b9242d8a2b5b7df8892c59c6c477be3a2a61bcf8a252671f31
    # Without --allowed-hosts the Host check only admits the bind address.
    command:
      [
        "-t",
        "streamable-http",
        "--address",
        "0.0.0.0:8000",
        "--allowed-hosts",
        "localhost:8000,127.0.0.1:8000",
        "--disable-write",
      ]
    environment:
      GRAFANA_URL: http://lgtm:3000
      GRAFANA_ORG_ID: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - lgtm

configs:
  otel-collector:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318

      exporters:
        otlphttp/lgtm:
          endpoint: http://lgtm:4318
        file:
          path: /out/otel.jsonl
          format: json

      service:
        pipelines:
          logs:
            receivers: [otlp]
            exporters: [otlphttp/lgtm, file]
