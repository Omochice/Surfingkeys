services:
  otel-collector:
    # The file exporter is not part of the core collector image, hence the contrib distribution.
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: otel-collector
        target: /etc/otelcol/config.yaml
    volumes:
      - ./.otel:/out
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - lgtm

  lgtm:
    image: grafana/otel-lgtm:0.35.0@sha256:2de1094c593c671cbfca878a28ffcd7e46ff5e32f2ce966c0cf33003f6cf4266
    ports:
      - "127.0.0.1:3000:3000"

  mcp-grafana:
    image: grafana/mcp-grafana:2.0.0@sha256:2ed63c4d9d67557c8ea6cc6988743ddd9008e248bd9842e760fec378a0b61062
    # Without --allowed-hosts the Host check only admits the bind address.
    command:
      [
        "-t",
        "streamable-http",
        "--address",
        "0.0.0.0:8000",
        "--allowed-hosts",
        "localhost:8000,127.0.0.1:8000",
        "--disable-write",
      ]
    environment:
      GRAFANA_URL: http://lgtm:3000
      GRAFANA_ORG_ID: "1"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - lgtm

configs:
  otel-collector:
    content: |
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318

      exporters:
        otlphttp/lgtm:
          endpoint: http://lgtm:4318
        file:
          path: /out/otel.jsonl
          format: json

      service:
        pipelines:
          logs:
            receivers: [otlp]
            exporters: [otlphttp/lgtm, file]
