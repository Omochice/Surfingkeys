packages:
  - "packages/*"
  - "apps/*"
# Only dependencies shared by two or more workspace packages live here; deps used by a single
# package are pinned in that package so colocation stays honest.
catalog:
  "@praha/byethrow": 0.12.0
  "@types/chrome": 0.1.43
  "@types/firefox-webext-browser": 143.0.0
  dompurify: ^3.2.4
  oxfmt: 0.54.0
  oxlint: 1.69.0
  solid-js: 1.9.13
  typescript: 6.0.3
  valibot: 1.4.1
  wxt: 0.20.26
allowBuilds:
  esbuild: true
  spawn-sync: false
executionEnv:
  nodeVersion: 24.16.0
